spring:
  application:
    name: ecommerce-marketing-platform
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/marketing_platform}
    username: ${SPRING_DATASOURCE_USERNAME:marketing_app}
    password: ${SPRING_DATASOURCE_PASSWORD:local_dev_only_change_me}
    hikari:
      pool-name: marketing-platform-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
