openapi: 3.1.0
info:
  title: E-commerce Marketing Platform API
  version: 1.5.0
  description: >-
    Approved API contract for the MVP. Persisted campaign states are DRAFT, ACTIVE, and PAUSED;
    ENDED is derived for a published campaign when endsAt has passed. Browser authentication
    uses HttpOnly cookies; state-changing requests require the configured CSRF header.
servers:
  - url: /api/v1
security: [ ]
paths:
  /auth/csrf:
    get:
      summary: Initialize CSRF cookie/token
      responses:
        '200':
          description: CSRF token initialized; cookie behavior is implementation-specific.
  /auth/login:
    post:
      summary: Authenticate and set access/refresh cookies
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, password ]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                password: { type: string, minLength: 1, writeOnly: true }
      responses:
        '200':
          description: Authenticated; tokens are set in HttpOnly cookies.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/refresh:
    post:
      summary: Atomically consume the current refresh token generation and issue the next token in the same family
      description: Each token generation is a separate server-side row in one tokenFamilyId. A consumed token cannot be used again. Reuse of a consumed/revoked token is rejected and revokes the whole token family.
      security: [ { refreshCookie: [ ] } ]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200': { description: Session refreshed; cookies rotated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      summary: Revoke the refresh-token family when the cookie is present and clear auth cookies
      description: The refresh cookie is optional for logout. If it identifies a token family, all active rows in that family are revoked. If absent or expired, the server still clears both cookies and returns 204. Logout remains possible when the access token is expired.
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: Logged out. }
  /auth/me:
    get:
      summary: Get current authenticated user
      security: [ { accessCookie: [ ] } ]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/campaigns:
    get:
      summary: List campaigns (createdAt descending)
      security: [ { accessCookie: [ ] } ]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, description: ENDED is an effective read-model status when publishedAt is set and endsAt has passed, whether its persisted state was ACTIVE or PAUSED; a draft remains DRAFT., schema: { type: string, enum: [ DRAFT, ACTIVE, PAUSED, ENDED ] } }
      responses:
        '200':
          description: Campaign page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignPageEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a draft campaign
      security: [ { accessCookie: [ ] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignWrite' }
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/campaigns/{campaignId}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      summary: Get campaign detail
      security: [ { accessCookie: [ ] } ]
      responses:
        '200':
          description: Campaign detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      summary: Update a draft campaign
      security: [ { accessCookie: [ ] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignWrite' }
      responses:
        '200':
          description: Campaign updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/campaigns/{campaignId}/publish:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      summary: Publish within the campaign window after validating one message, at least one positive-inventory coupon, and the audience snapshot
      security: [ { accessCookie: [ ] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      responses:
        '202':
          description: Publication committed; delivery proceeds asynchronously. A zero-member audience is valid, returns deliveryStatus COMPLETED with no inbox rows, and includes warningCode NO_AUDIENCE_MEMBERS.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' } # Includes CAMPAIGN_NOT_PUBLISHABLE for invalid setup or outside the campaign window.
  /admin/campaigns/{campaignId}/pause:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      summary: Pause active campaign; committed delivery job continues even while pending, and new claims are blocked after pause commits
      security: [ { accessCookie: [ ] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      responses:
        '200': { description: Campaign paused; the delivery job committed during publication continues even if still PENDING, and existing inbox messages are not retracted. Claims already holding the campaign shared lock may complete before this response; later claims are rejected. }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/campaigns/{campaignId}/delivery/retry:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      summary: Retry a FAILED delivery job from its last committed cursor
      description: Requires ADMIN. Only FAILED jobs may be retried. Sets status to PENDING, resets attemptCount to zero, clears lastError, and preserves cursorMemberId. Other states return 409 DELIVERY_JOB_NOT_RETRYABLE.
      security: [ { accessCookie: [ ] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      responses:
        '202': { description: Delivery retry accepted for an ADMIN. Only FAILED is retryable; other states return 409 DELIVERY_JOB_NOT_RETRYABLE. }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/audience-segments:
    get:
      summary: List reusable audience segments (createdAt descending)
      security: [ { accessCookie: [ ] } ]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paginated reusable audience segments ordered by createdAt descending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudienceSegmentPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create reusable audience segment
      security: [ { accessCookie: [ ] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AudienceSegmentWrite' }
      responses:
        '201':
          description: Segment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudienceSegmentEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/audience-segments/preview:
    post:
      summary: Preview audience rules
      description: Age conditions use the current Asia/Taipei date at preview time; campaign publication evaluates age on the actual publication date. Preview is an estimate.
      security: [ { accessCookie: [ ] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AudienceRules' }
      responses:
        '200':
          description: Matching member count and up to 10 non-sensitive member display identifiers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudiencePreviewEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/audience-segments/{segmentId}:
    parameters:
      - name: segmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get reusable audience segment
      security: [ { accessCookie: [ ] } ]
      responses:
        '200':
          description: Audience segment detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudienceSegmentEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      summary: Update reusable audience segment
      security: [ { accessCookie: [ ] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AudienceSegmentWrite' }
      responses:
        '200':
          description: Audience segment updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudienceSegmentEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/campaigns/{campaignId}/audience-preview:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      summary: Preview effective audience for a campaign
      description: Age conditions use the current Asia/Taipei date at preview time; the publication snapshot uses the actual publication date and is authoritative.
      security: [ { accessCookie: [ ] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      responses:
        '200':
          description: Matching member count and up to 10 non-sensitive member display identifiers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudiencePreviewEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/campaigns/{campaignId}/coupons:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      summary: List campaign coupon configurations (createdAt ascending)
      security: [ { accessCookie: [ ] } ]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': { description: Campaign coupon list. }
    post:
      summary: Add a coupon to a draft campaign
      security: [ { accessCookie: [ ] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponWrite' }
      responses:
        '201': { description: Campaign coupon created. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/campaigns/{campaignId}/coupons/{couponId}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - name: couponId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Update a coupon on a draft campaign
      security: [ { accessCookie: [ ] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponWrite' }
      responses:
        '200': { description: Coupon updated. }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/campaigns/{campaignId}/message:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      summary: Get the campaign's single in-app message
      security: [ { accessCookie: [ ] } ]
      responses:
        '200':
          description: Campaign message configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignMessageEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Create or update the campaign's single in-app message while draft
      security: [ { accessCookie: [ ] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ title, body ]
              properties:
                title: { type: string, minLength: 1, maxLength: 160 }
                body: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        '200':
          description: Campaign message saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignMessageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/campaigns/{campaignId}/delivery-status:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      summary: Get asynchronous delivery progress and failures
      description: Requires ADMIN.
      security: [ { accessCookie: [ ] } ]
      responses:
        '200':
          description: Delivery status, totalCount, processedCount, cursorMemberId, attemptCount (automatic retries consumed, 0-3), sanitized lastError, and retryable. Batch size is 100; initial attempt plus three automatic retries use 1s/2s/4s backoff; a fourth total failure marks FAILED; successful batch resets attemptCount.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryStatusEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /member/profile:
    get:
      summary: Get current member profile
      security: [ { accessCookie: [ ] } ]
      responses:
        '200':
          description: Profile for the authenticated MEMBER principal only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberProfileEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /member/messages:
    get:
      summary: List current member inbox (deliveredAt descending)
      security: [ { accessCookie: [ ] } ]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Current member inbox page, scoped to the authenticated member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberMessagePageEnvelope' }
  /member/messages/{messageId}:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a message from the current member inbox
      security: [ { accessCookie: [ ] } ]
      responses:
        '200':
          description: Inbox message detail for the authenticated member only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberMessageEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /member/coupons:
    get:
      summary: List current member's successful coupon claims (claimedAt descending)
      security: [ { accessCookie: [ ] } ]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': { description: Current member claim list. }
  /campaigns/{campaignId}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      summary: Get published campaign's public fixed-template landing content; include member state only when authenticated
      description: Published landing pages remain readable when PAUSED or effectively ENDED. New coupon claims are disabled in those states. Authenticated members outside the audience snapshot receive notEligible; anonymous responses contain no member-specific state.
      security:
        - accessCookie: [ ]
        - { }
      responses:
        '200': { description: Campaign landing-page data. }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaigns/{campaignId}/coupons:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      summary: List public coupon summaries and authenticated member claim state when available (createdAt ascending)
      description: Coupon summaries remain public when campaign is PAUSED or effectively ENDED; coupons are marked unavailable for new claims. Authenticated non-eligible members receive notEligible; anonymous responses omit member-specific state.
      security:
        - accessCookie: [ ]
        - { }
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': { description: Coupon list; member-specific state is omitted for anonymous callers. }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaigns/{campaignId}/coupons/{couponId}/claims:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - name: couponId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Claim a campaign coupon; requires an authenticated MEMBER
      description: Requires an authenticated MEMBER. Anonymous callers receive 401; the frontend must route them to sign-in and return them to this campaign afterward. A successful retry with the same member, idempotency key, campaign, and coupon returns the original claim even if the campaign is now paused or ended; replay is checked before new-claim eligibility.
      security: [ { accessCookie: [ ] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ idempotencyKey ]
              properties:
                idempotencyKey: { type: string, format: uuid }
      responses:
        '201':
          description: Coupon successfully claimed; replaying the same member/idempotency key for the same coupon returns the original claim result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /campaigns/{campaignId}/events:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      summary: Record authenticated member impression, click, or landing-page view
      description: Requires an authenticated MEMBER. Anonymous public landing-page views are not submitted and do not create member-attributed events. Claim-attempt audit events are generated server-side by the claim use case and cannot be submitted through this endpoint.
      security: [ { accessCookie: [ ] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EngagementEventWrite' }
      responses:
        '202': { description: Event accepted; duplicate event IDs are idempotent. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/campaigns/{campaignId}/analytics:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      summary: Get campaign metrics
      description: Delivered from member_messages; engagement totals from campaign_events; unique landing visitors are audience-snapshot members with authenticated page views; successful claims/claimers from coupon_claims; claim attempts are separate audit counts. Rates are delivery/target, reach/target, click/delivered, target landing visitors/target, and target claimers/target. No click-to-landing attribution rate is reported.
      security: [ { accessCookie: [ ] } ]
      responses:
        '200': { description: Campaign metrics with totals and distinct-member counts. }
  /admin/campaigns/{campaignId}/coupons/analytics:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      summary: Get coupon-level claim analytics
      security: [ { accessCookie: [ ] } ]
      responses:
        '200': { description: Coupon quantity, claims, remaining quantity, and unique claimers. }
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
  schemas:
    CurrentUserEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            userId: { type: string, format: uuid }
            role: { type: string, enum: [ ADMIN, MEMBER ] }
    CampaignWrite:
      type: object
      required: [ name, startsAt, endsAt, landingPage, audience ]
      properties:
        name: { type: string, maxLength: 160 }
        description: { type: [ string, 'null' ] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        landingPage:
          type: object
          required: [ headline, body ]
          properties:
            headline: { type: string, maxLength: 200 }
            body: { type: string, maxLength: 10000 }
        audience:
          type: object
          description: Provide segmentId, rules, or both. When both are present, they are combined with AND. NULL-valued member attributes never match supported comparisons; explicit NULL checks are not supported.
          anyOf:
            - required: [ segmentId ]
            - required: [ rules ]
          properties:
            segmentId: { type: string, format: uuid }
            rules: { $ref: '#/components/schemas/AudienceRules' }
    AudienceSegmentWrite:
      type: object
      required: [ name, rules ]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: [ string, 'null' ], maxLength: 500 }
        rules: { $ref: '#/components/schemas/AudienceRules' }
    AudienceRules:
      type: object
      additionalProperties: false
      description: >-
        Canonical field/operator matrix: age INTEGER 0..120 supports all comparison and set operators; gender ENUM (FEMALE, MALE, OTHER, UNDISCLOSED) and membershipTier ENUM (STANDARD, SILVER, GOLD, PLATINUM) support only =, !=, IN, NOT IN; registeredAt DATETIME, orderCount INTEGER >= 0, totalSpending DECIMAL >= 0 with at most 2 decimal places, lastOrderAt nullable DATETIME, and lastLoginAt nullable DATETIME support all comparison and set operators. Comparison operators take one non-null scalar; IN/NOT IN take a non-empty array of non-null exact-type values. Enum values are case-sensitive. Ordered comparisons are invalid for enums. NULL member attributes never match any operator, including != and NOT IN. The backend validator enforces the matrix before constructing SQL.
      required: [ version, match, conditions ]
      properties:
        version: { type: integer, const: 1 }
        match: { type: string, const: ALL, description: ALL means AND in MVP. }
        conditions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [ field, operator, value ]
            properties:
              field:
                type: string
                enum: [ age, gender, registeredAt, membershipTier, orderCount, totalSpending, lastOrderAt, lastLoginAt ]
              operator:
                type: string
                enum: [ '=', '!=', '>', '>=', '<', '<=', IN, 'NOT IN' ]
              value:
                oneOf:
                  - type: string
                  - type: number
                  - type: array
                    minItems: 1
                    items:
                      type: [ string, number ]
                description: Comparison operators require one non-null scalar; IN and NOT IN require a non-empty array of non-null scalars. Values must match the selected field type; NULL values and NULL array items are invalid.
    AudienceSegmentEnvelope:
      type: object
      required: [ data ]
      properties:
        data: { $ref: '#/components/schemas/AudienceSegment' }
    AudienceSegmentPageEnvelope:
      type: object
      required: [ data, page ]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AudienceSegment' } }
        page:
          type: object
          required: [ number, size, totalElements, totalPages ]
          properties:
            number: { type: integer }
            size: { type: integer }
            totalElements: { type: integer }
            totalPages: { type: integer }
    AudienceSegment:
      type: object
      required: [ id, name, rules, createdByUserId, createdAt, updatedAt ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        description: { type: [ string, 'null' ], maxLength: 500 }
        rules: { $ref: '#/components/schemas/AudienceRules' }
        createdByUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AudiencePreviewEnvelope:
      type: object
      required: [ data ]
      properties:
        data:
          type: object
          required: [ count, sample ]
          properties:
            count: { type: integer, minimum: 0 }
            sample:
              type: array
              maxItems: 10
              items:
                type: object
                required: [ memberId, displayName ]
                properties:
                  memberId: { type: string, format: uuid }
                  displayName: { type: string }
    MemberProfileEnvelope:
      type: object
      required: [ data ]
      properties:
        data:
          type: object
          required: [ memberId, displayName, registeredAt, membershipTier, orderCount, totalSpending ]
          properties:
            memberId: { type: string, format: uuid }
            displayName: { type: string }
            birthDate: { type: [ string, 'null' ], format: date }
            age: { type: [ integer, 'null' ], description: Derived using the Asia/Taipei calendar date. }
            gender: { type: [ string, 'null' ], enum: [ FEMALE, MALE, OTHER, UNDISCLOSED, null ] }
            registeredAt: { type: string, format: date-time }
            membershipTier: { type: string, enum: [ STANDARD, SILVER, GOLD, PLATINUM ] }
            orderCount: { type: integer, minimum: 0 }
            totalSpending: { type: number, minimum: 0 }
            lastOrderAt: { type: [ string, 'null' ], format: date-time }
            lastLoginAt: { type: [ string, 'null' ], format: date-time }
    CouponWrite:
      type: object
      required: [ name, discountType, discountValue, totalQuantity, startsAt, endsAt ]
      properties:
        name: { type: string, maxLength: 160 }
        description: { type: [ string, 'null' ] }
        discountType: { type: string, enum: [ FIXED_AMOUNT, PERCENTAGE ] }
        discountValue: { type: number, exclusiveMinimum: 0, description: For FIXED_AMOUNT, a TWD amount. For PERCENTAGE, percentage points (for example 10 means 10 percent off; maximum 100). }
        minimumOrderAmount: { type: [ number, 'null' ], minimum: 0 }
        totalQuantity: { type: integer, minimum: 1, description: At least one configured coupon with positive inventory is required before campaign publication. }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
      allOf:
        - if:
            properties:
              discountType: { const: PERCENTAGE }
            required: [ discountType ]
          then:
            properties:
              discountValue: { maximum: 100 }
    CampaignEnvelope:
      type: object
      required: [ data ]
      properties:
        data: { $ref: '#/components/schemas/CampaignDetail' }
    CampaignDetail:
      type: object
      required: [ id, name, status, startsAt, endsAt, landingPage, audience, createdAt, updatedAt ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
        description: { type: [ string, 'null' ] }
        status: { type: string, enum: [ DRAFT, ACTIVE, PAUSED, ENDED ], description: ENDED is derived when publishedAt is set and endsAt has passed, whether persisted state was ACTIVE or PAUSED; it is not persisted. A draft with a past endsAt remains DRAFT. }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        landingPage:
          type: object
          required: [ headline, body ]
          properties:
            headline: { type: string, maxLength: 200 }
            body: { type: string, maxLength: 10000 }
        audience:
          type: object
          required: [ segmentId, rules ]
          properties:
            segmentId: { type: [ string, 'null' ], format: uuid }
            rules: { oneOf: [ { $ref: '#/components/schemas/AudienceRules' }, { type: 'null' } ] }
        publishedAt: { type: [ string, 'null' ], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CampaignSummary:
      type: object
      required: [ id, name, status, startsAt, endsAt, createdAt, updatedAt ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
        description: { type: [ string, 'null' ] }
        status: { type: string, enum: [ DRAFT, ACTIVE, PAUSED, ENDED ] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        publishedAt: { type: [ string, 'null' ], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CampaignPageEnvelope:
      type: object
      required: [ data, page ]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/CampaignSummary' } }
        page:
          type: object
          required: [ number, size, totalElements, totalPages ]
          properties:
            number: { type: integer }
            size: { type: integer }
            totalElements: { type: integer }
            totalPages: { type: integer }
    PublishEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            campaignId: { type: string, format: uuid }
            status: { type: string, const: ACTIVE }
            audienceCount: { type: integer }
            deliveryStatus: { type: string, enum: [ PENDING, PROCESSING, COMPLETED, FAILED ] }
            warningCode: { type: [ string, 'null' ], enum: [ NO_AUDIENCE_MEMBERS, null ], description: Present when audienceCount is zero. }
            publishedAt: { type: string, format: date-time }
    CampaignMessageEnvelope:
      type: object
      required: [ data ]
      properties:
        data:
          type: object
          required: [ id, campaignId, title, body, createdAt, updatedAt ]
          properties:
            id: { type: string, format: uuid }
            campaignId: { type: string, format: uuid }
            title: { type: string, minLength: 1, maxLength: 160 }
            body: { type: string, minLength: 1, maxLength: 10000 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MemberMessage:
      type: object
      required: [ id, campaignId, campaignName, title, body, deliveredAt ]
      properties:
        id: { type: string, format: uuid, description: Member inbox row ID. }
        campaignId: { type: string, format: uuid }
        campaignName: { type: string }
        title: { type: string }
        body: { type: string }
        deliveredAt: { type: string, format: date-time }
    MemberMessageEnvelope:
      type: object
      required: [ data ]
      properties:
        data: { $ref: '#/components/schemas/MemberMessage' }
    MemberMessagePageEnvelope:
      type: object
      required: [ data, page ]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MemberMessage' }
        page:
          type: object
          required: [ number, size, totalElements, totalPages ]
          properties:
            number: { type: integer, minimum: 0 }
            size: { type: integer, minimum: 1, maximum: 100 }
            totalElements: { type: integer, minimum: 0 }
            totalPages: { type: integer, minimum: 0 }
    DeliveryStatusEnvelope:
      type: object
      properties:
        data:
          type: object
          required: [ status, totalCount, processedCount, attemptCount, retryable ]
          properties:
            status: { type: string, enum: [ PENDING, PROCESSING, COMPLETED, FAILED ] }
            totalCount: { type: integer, minimum: 0 }
            processedCount: { type: integer, minimum: 0 }
            cursorMemberId: { type: [ string, 'null' ], format: uuid }
            attemptCount: { type: integer, minimum: 0, maximum: 3, description: Automatic retries consumed at the current cursor. }
            lastError: { type: [ string, 'null' ] }
            retryable: { type: boolean, description: True only when status is FAILED. }
    ClaimEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            claimId: { type: string, format: uuid }
            campaignId: { type: string, format: uuid }
            couponId: { type: string, format: uuid }
            status: { type: string, const: CLAIMED }
            claimedAt: { type: string, format: date-time }
    EngagementEventWrite:
      type: object
      required: [ eventId, eventType, occurredAt ]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, enum: [ IMPRESSION, CLICK, LANDING_PAGE_VIEW ] }
        messageId: { type: [ string, 'null' ], format: uuid }
        occurredAt: { type: string, format: date-time }
      allOf:
        - if:
            properties:
              eventType: { enum: [ IMPRESSION, CLICK ] }
            required: [ eventType ]
          then:
            required: [ messageId ]
            properties:
              messageId: { type: string, format: uuid }
        - if:
            properties:
              eventType: { const: LANDING_PAGE_VIEW }
            required: [ eventType ]
          then:
            properties:
              messageId: { type: 'null' }
    Error:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        traceId: { type: string }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated principal is not authorized or CSRF validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Business state conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
